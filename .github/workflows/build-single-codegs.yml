name: Build single Code.gs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps-script/Code.gs"
      - "apps-script/ProductReports.gs"
      - ".github/workflows/build-single-codegs.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build clean single Apps Script file
        shell: python
        run: |
          from pathlib import Path
          import re

          base_path = Path("apps-script/Code.gs")
          reports_path = Path("apps-script/ProductReports.gs")
          output_path = Path("apps-script/Code.full.gs")

          base = base_path.read_text(encoding="utf-8")
          reports = reports_path.read_text(encoding="utf-8")

          def remove_function(source, name):
              pattern = re.compile(r"(^|\n)\s*function\s+" + re.escape(name) + r"\s*\(", re.M)
              match = pattern.search(source)
              if not match:
                  return source

              start = match.start()
              brace = source.find("{", match.end())
              if brace < 0:
                  raise RuntimeError(f"Opening brace not found for {name}")

              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = brace

              while i < len(source):
                  ch = source[i]
                  nxt = source[i + 1] if i + 1 < len(source) else ""

                  if line_comment:
                      if ch == "\n":
                          line_comment = False
                  elif block_comment:
                      if ch == "*" and nxt == "/":
                          block_comment = False
                          i += 1
                  elif quote:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch == "/" and nxt == "/":
                          line_comment = True
                          i += 1
                      elif ch == "/" and nxt == "*":
                          block_comment = True
                          i += 1
                      elif ch in ('"', "'", "`"):
                          quote = ch
                      elif ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              while end < len(source) and source[end] in " \t\r\n":
                                  end += 1
                              return source[:start].rstrip() + "\n\n" + source[end:]
                  i += 1

              raise RuntimeError(f"Closing brace not found for {name}")

          # These functions are replaced by ProductReports.gs or are unused legacy copies.
          obsolete = [
              "getOperationalReports",
              "buildInventoryPlanning_",
              "estimateDailyUsage_",
              "buildSupplierAnalytics_",
          ]
          for function_name in obsolete:
              base = remove_function(base, function_name)

          # Remove the instructional header because the output is already a single file.
          reports = re.sub(r"^/\*\*[\s\S]*?\*/\s*", "", reports, count=1)

          header = '''/**
           * SAN JOSE OPERATIONAL SYSTEM — COMPLETE GOOGLE APPS SCRIPT
           * Generated automatically from the operational backend and Product Reports V3.
           * Paste this entire file into Code.gs, save, and deploy a new web-app version.
           */\n\n'''

          combined = header + base.rstrip() + "\n\n\n// ================= PRODUCT REPORTS V3 =================\n\n" + reports.rstrip() + "\n"
          output_path.write_text(combined, encoding="utf-8")

          # Basic duplicate and structure checks.
          assert combined.count("function getOperationalReports(") == 1
          assert "function doGet(" in combined
          assert "function doPost(" in combined
          assert "function inventorySnapshot(" in combined
          assert "function saveRackInventory(" in combined
          assert "function createSalesOrder(" in combined
          assert "function createPurchaseOrder(" in combined
          print(f"Wrote {output_path} with {combined.count(chr(10)) + 1} lines")

      - name: Commit generated file
        run: |
          if git diff --quiet -- apps-script/Code.full.gs; then
            echo "Code.full.gs is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Code.full.gs
          git commit -m "Build complete single Code.gs [skip ci]"
          git push
